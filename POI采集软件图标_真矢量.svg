  <ellipse cx="625" cy="839" rx="89" ry="44" fill="#FFFFFF"/>
  <ellipse cx="625" cy="836" rx="39" ry="21" fill="url(#dotGrad)"/>

  <!-- main POI marker -->
  <g>
    <path d="M625 317
             C527 317 449 392 449 487
             C449 550 475 598 521 662
             L611 795
             C618 806 630 809 638 796
             L730 660
             C773 598 803 550 803 487
             C803 392 724 317 625 317 Z" fill="url(#pinGrad)"/>
    <ellipse cx="625" cy="501" rx="77" ry="77" fill="#FFFFFF"/>
  </g>
