  <g fill="none" stroke="#C8D4EC" stroke-width="11.5" stroke-linecap="round">
    <path d="M296 500 C286 557 289 623 311 680" stroke-dasharray="24 28"/>
    <path d="M953 500 C963 557 960 623 939 680" stroke-dasharray="24 28"/>
  </g>

  <!-- network nodes -->
  <circle cx="626" cy="229" r="32.5" fill="url(#topNodeGrad)"/>
  <circle cx="310" cy="452" r="30.5" fill="url(#leftNodeGrad)"/>
  <circle cx="938" cy="452" r="30.5" fill="url(#rightNodeGrad)"/>

