    <path d="M618 938 C674 938 726 923 786 891 L835 1001 L591 1001 Z" fill="url(#mapMRB)"/>
    <path d="M808 876 L1010 876 L1058 957 Q1064 979 1047 995 Q1040 1001 1031 1001 L868 1001 Z" fill="url(#mapRB)"/>
  </g>

