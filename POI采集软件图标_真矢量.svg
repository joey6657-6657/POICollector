    <path d="M904 718 Q921 722 933 742 L998 854 L809 854 C807 833 798 815 779 798 Z" fill="url(#mapRT)"/>

    <path d="M254 851 L368 851 L271 1001 L222 1001 Q199 998 193 980 Q188 966 196 951 Z" fill="url(#mapLB)"/>
