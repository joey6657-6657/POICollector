# 默认配置模板（user_config.yaml 由界面“保存配置”自动生成；API Key 不随配置保存）
# 说明：程序不会把 API Key 写入 user_config.yaml；每次启动或加载配置后均需在界面重新填写。
api_key: ""            # 保持为空；请在界面填写高德 Web 服务 Key，多 Key 用英文逗号分隔
mode: around           # around | text | polygon | detail
around:
  lng: ""
  lat: ""
  radius: 5000
  keywords: ""
  city: ""
  citylimit: false
  sortrule: distance
text:
  keywords: ""
  city: ""
  citylimit: false
polygon:
  vertices: ""
detail:
  id: ""
types: []              # 选中的 POI 大类编码，如 ["050000","130000"]
extensions: base      # base | all
offset: "20"          # 每页条数 10/20/25
autopage: true        # 自动翻页（上限约 200 条）
fmt: csv              # csv | excel | geojson | json
output: ""            # 导出文件完整路径
